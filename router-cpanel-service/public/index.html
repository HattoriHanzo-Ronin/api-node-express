<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Router control panel</title>
        <style>
            :root { --tools-background: #252525; --tools-color: #fff; --tools-selected: rgba(76, 175, 80, 0.2); }
            :root[data-theme="light"] { --tools-background: #d9dddf; --tools-color: #263238; --tools-selected: rgba(46, 125, 50, 0.16); }
            html, body { position: fixed; inset: 0; margin: 0; overflow: hidden; background: #111; }
            #screen { width: 100%; height: 100dvh; overflow: hidden; }
            #loading { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; color: #fff; background: rgba(0, 0, 0, 0.35); font: 600 16px sans-serif; }
            #loading[hidden] { display: none; }
            #mobile-tools { position: fixed; right: 16px; bottom: 16px; z-index: 1; display: flex; align-items: flex-end; gap: 6px; }
            #mobile-actions { display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; align-content: flex-end; gap: 6px; max-width: calc(100vw - 128px); }
            #mobile-actions[hidden] { display: none; }
            #mobile-tools button { width: 40px; height: 40px; border: 0; border-radius: 20px; color: var(--tools-color); background: var(--tools-background); font-size: 20px; }
            #mobile-tools button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px #4caf50; background: linear-gradient(var(--tools-selected), var(--tools-selected)), var(--tools-background); }
            #selection-mode { font-family: Georgia, serif; font-size: 24px; font-weight: 700; }
            #keyboard-toggle { width: 48px !important; height: 48px !important; border-radius: 24px !important; font-size: 24px !important; }
            #keyboard-input { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0.01; }
        </style>
    </head>
    <body>
        <div id="screen"></div>
        <div id="loading" hidden>Cargando…</div>
        <div id="mobile-tools" hidden>
            <div id="mobile-actions" hidden>
                <button id="selection-mode" type="button" aria-label="Modo selección">I</button>
                <button id="zoom-out" type="button" aria-label="Reducir tamaño">−</button>
                <button id="zoom-in" type="button" aria-label="Aumentar tamaño">+</button>
                <button id="clipboard-paste" type="button" aria-label="Pegar desde el portapapeles">📋</button>
            </div>
            <button id="tools-toggle" type="button" aria-label="Mostrar controles">‹</button>
            <button id="keyboard-toggle" type="button" aria-label="Mostrar teclado">⌨</button>
        </div>
        <textarea id="keyboard-input" aria-label="Teclado remoto" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
        <script type="module" src="./viewer.js"></script>
    </body>
</html>
